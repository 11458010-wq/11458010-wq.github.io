<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>李宥叡 | 聊天對話窗</title>
    <style>
      :root {
        --bg-1: #f6efe8;
        --bg-2: #e4edf7;
        --bg-3: #f9f1d9;
        --ink: #1d2430;
        --muted: #5f6977;
        --panel: rgba(255, 255, 255, 0.78);
        --panel-strong: rgba(255, 255, 255, 0.92);
        --line: rgba(29, 36, 48, 0.12);
        --shadow: 0 24px 60px rgba(20, 30, 45, 0.14);
        --accent: #0f766e;
        --accent-2: #c2410c;
        --accent-3: #1d4ed8;
        --bubble-self: linear-gradient(135deg, #f59e0b, #fb7185);
        --bubble-other: linear-gradient(135deg, #0f766e, #2563eb);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        min-height: 100vh;
        color: var(--ink);
        font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
        background:
          radial-gradient(circle at 12% 10%, rgba(15, 118, 110, 0.18), transparent 30%),
          radial-gradient(circle at 88% 14%, rgba(244, 114, 182, 0.16), transparent 28%),
          radial-gradient(circle at 78% 86%, rgba(37, 99, 235, 0.12), transparent 30%),
          linear-gradient(135deg, var(--bg-1), var(--bg-2) 52%, var(--bg-3));
        overflow-x: hidden;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image: repeating-linear-gradient(
          135deg,
          rgba(29, 36, 48, 0.03) 0,
          rgba(29, 36, 48, 0.03) 1px,
          transparent 1px,
          transparent 10px
        );
        opacity: 0.55;
      }

      .page {
        width: min(440px, 100vw);
        min-height: 100vh;
        margin: 0 auto;
        padding: 1rem 0.8rem 1.1rem;
        position: relative;
      }

      .frame {
        min-height: calc(100vh - 2.1rem);
        display: grid;
        grid-template-rows: auto auto 1fr auto;
        gap: 0.8rem;
        border: 1px solid var(--line);
        border-radius: 28px;
        padding: 1rem;
        background: rgba(255, 255, 255, 0.5);
        backdrop-filter: blur(16px);
        box-shadow: var(--shadow);
        position: relative;
        overflow: hidden;
      }

      .frame::after {
        content: "";
        position: absolute;
        inset: auto -16% -20% auto;
        width: 180px;
        height: 180px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(15, 118, 110, 0.16), transparent 68%);
        pointer-events: none;
      }

      .topbar {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 0.75rem;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        padding: 0.28rem 0.62rem;
        border-radius: 999px;
        border: 1px solid rgba(15, 118, 110, 0.24);
        background: rgba(255, 255, 255, 0.72);
        color: var(--accent);
        font-size: 0.74rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .eyebrow::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: linear-gradient(135deg, #10b981, #2563eb);
      }

      h1 {
        margin: 0.55rem 0 0;
        font-family: "Noto Serif TC", "PMingLiU", serif;
        font-size: clamp(1.8rem, 7vw, 2.35rem);
        line-height: 1.05;
      }

      .subtitle {
        margin: 0.55rem 0 0;
        color: var(--muted);
        line-height: 1.65;
        font-size: 0.95rem;
      }

      .designer {
        align-self: start;
        padding: 0.55rem 0.8rem;
        border-radius: 16px;
        background: linear-gradient(135deg, rgba(109, 40, 217, 0.92), rgba(236, 72, 153, 0.92));
        color: #fff;
        font-size: 0.78rem;
        letter-spacing: 0.02em;
        box-shadow: 0 12px 28px rgba(109, 40, 217, 0.24);
        white-space: nowrap;
      }

      .panel {
        border: 1px solid var(--line);
        border-radius: 22px;
        background: var(--panel);
        backdrop-filter: blur(12px);
        box-shadow: 0 14px 30px rgba(20, 30, 45, 0.08);
      }

      .controls {
        padding: 0.9rem;
      }

      .controls-grid {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 0.65rem;
        align-items: end;
      }

      label {
        display: block;
        margin: 0 0 0.35rem;
        font-size: 0.8rem;
        color: var(--muted);
      }

      .input,
      .textarea {
        width: 100%;
        border: 1px solid rgba(29, 36, 48, 0.16);
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.9);
        color: var(--ink);
        outline: none;
        transition: border-color 160ms ease, box-shadow 160ms ease, transform 160ms ease;
      }

      .input:focus,
      .textarea:focus {
        border-color: rgba(15, 118, 110, 0.45);
        box-shadow: 0 0 0 4px rgba(15, 118, 110, 0.12);
      }

      .input {
        padding: 0.82rem 0.92rem;
        font-size: 0.98rem;
      }

      .button {
        border: 0;
        border-radius: 16px;
        padding: 0.86rem 1rem;
        color: #fff;
        font-weight: 700;
        letter-spacing: 0.02em;
        cursor: pointer;
        background: linear-gradient(135deg, var(--accent), var(--accent-3));
        box-shadow: 0 10px 24px rgba(37, 99, 235, 0.24);
        transition: transform 160ms ease, filter 160ms ease, opacity 160ms ease;
      }

      .button.secondary {
        background: linear-gradient(135deg, #b45309, var(--accent-2));
      }

      .button:disabled {
        cursor: not-allowed;
        opacity: 0.6;
        box-shadow: none;
      }

      .button:hover:not(:disabled),
      .button:focus-visible:not(:disabled) {
        transform: translateY(-1px);
        filter: saturate(1.1);
        outline: none;
      }

      .statusbar {
        display: flex;
        flex-wrap: wrap;
        gap: 0.45rem;
        align-items: center;
        justify-content: space-between;
        padding: 0.72rem 0.9rem;
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 0.45rem;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        padding: 0.4rem 0.62rem;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.9);
        color: var(--muted);
        font-size: 0.78rem;
        border: 1px solid rgba(29, 36, 48, 0.08);
      }

      .chip strong {
        color: var(--ink);
      }

      .chip[data-state="ready"] {
        color: #166534;
      }

      .chip[data-state="connected"] {
        color: #0f766e;
      }

      .chip[data-state="error"] {
        color: #b91c1c;
      }

      .chat {
        display: grid;
        grid-template-rows: 1fr auto;
        gap: 0.75rem;
        min-height: 0;
        padding: 0.9rem;
      }

      .messages {
        display: flex;
        flex-direction: column;
        gap: 0.7rem;
        min-height: 0;
        overflow: auto;
        padding-right: 0.1rem;
        scroll-behavior: smooth;
      }

      .empty {
        display: grid;
        place-items: center;
        min-height: 100%;
        padding: 1rem;
        text-align: center;
        color: var(--muted);
        line-height: 1.7;
      }

      .bubble {
        max-width: 84%;
        padding: 0.78rem 0.88rem;
        border-radius: 18px;
        color: #fff;
        box-shadow: 0 12px 26px rgba(20, 30, 45, 0.14);
        position: relative;
        animation: rise 240ms ease-out both;
        word-break: break-word;
        white-space: pre-wrap;
      }

      .bubble.self {
        align-self: flex-end;
        background: var(--bubble-self);
        border-bottom-right-radius: 6px;
      }

      .bubble.other {
        align-self: flex-start;
        background: var(--bubble-other);
        border-bottom-left-radius: 6px;
      }

      .bubble.meta {
        padding-bottom: 1.1rem;
      }

      .bubble .time {
        display: block;
        margin-top: 0.5rem;
        font-size: 0.72rem;
        opacity: 0.82;
      }

      .composer {
        display: grid;
        gap: 0.6rem;
      }

      .textarea {
        min-height: 74px;
        max-height: 180px;
        resize: none;
        padding: 0.82rem 0.92rem;
        font: inherit;
        line-height: 1.55;
      }

      .actions {
        display: flex;
        gap: 0.6rem;
      }

      .actions .button {
        flex: 1;
      }

      .footer {
        display: flex;
        justify-content: space-between;
        gap: 0.75rem;
        flex-wrap: wrap;
        color: var(--muted);
        font-size: 0.78rem;
        padding: 0 0.2rem 0.1rem;
      }

      .footer strong {
        color: var(--ink);
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(14px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 420px) {
        .page {
          width: 100vw;
          padding: 0.55rem;
        }

        .frame {
          min-height: calc(100vh - 1.1rem);
          border-radius: 22px;
          padding: 0.8rem;
        }

        .controls-grid {
          grid-template-columns: 1fr;
        }

        .designer {
          white-space: normal;
          text-align: right;
        }

        .bubble {
          max-width: 88%;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="frame" aria-label="ntfy 聊天對話窗">
        <div class="topbar">
          <div>
            <span class="eyebrow">ntfy.sh / HTTPS</span>
            <h1>聊天對話窗</h1>
            <p class="subtitle">
              透過標準 HTTPS 連接 <strong>ntfy.sh</strong>，可自由切換 Topic，預設為 <strong>drher</strong>。
            </p>
          </div>
          <div class="designer">設計者: 李宥叡</div>
        </div>

        <section class="panel controls" aria-label="連線設定">
          <div class="controls-grid">
            <div>
              <label for="topicInput">Topic</label>
              <input id="topicInput" class="input" type="text" inputmode="latin" autocomplete="off" spellcheck="false" />
            </div>
            <button id="connectButton" class="button secondary" type="button">連線</button>
          </div>
        </section>

        <section class="panel statusbar" aria-label="連線狀態">
          <div class="chips">
            <span id="stateChip" class="chip" data-state="ready"><strong>狀態</strong>：待連線</span>
            <span id="topicChip" class="chip"><strong>Topic</strong>：drher</span>
          </div>
          <span class="chip"><strong>API</strong>：/sse + POST</span>
        </section>

        <section class="panel chat" aria-label="聊天內容">
          <div id="messages" class="messages" aria-live="polite" aria-relevant="additions">
            <div id="emptyState" class="empty">
              <div>
                先按「連線」訂閱 Topic，之後就能即時收訊息。<br />
                送出內容會使用 ntfy 的 HTTPS POST，接收端則透過 SSE 更新。
              </div>
            </div>
          </div>

          <form id="composer" class="composer" autocomplete="off">
            <label for="messageInput">訊息</label>
            <textarea
              id="messageInput"
              class="textarea"
              rows="3"
              placeholder="輸入訊息，Enter 送出，Shift+Enter 換行"
            ></textarea>
            <div class="actions">
              <button id="sendButton" class="button" type="submit" disabled>送出訊息</button>
              <button id="clearButton" class="button secondary" type="button">清除畫面</button>
            </div>
          </form>
        </section>

        <div class="footer">
          <span>Topic 可自訂，預設值為 drher。</span>
          <span>連線與傳送都使用 https://ntfy.sh。</span>
        </div>
      </section>
    </main>

    <script>
      const DEFAULT_TOPIC = "drher";
      const SENDER_NAME = "宥叡";
      const STORAGE_KEY = "ntfy-chat-topic";
      const topicInput = document.getElementById("topicInput");
      const topicChip = document.getElementById("topicChip");
      const stateChip = document.getElementById("stateChip");
      const connectButton = document.getElementById("connectButton");
      const sendButton = document.getElementById("sendButton");
      const clearButton = document.getElementById("clearButton");
      const composer = document.getElementById("composer");
      const messageInput = document.getElementById("messageInput");
      const messages = document.getElementById("messages");
      const emptyState = document.getElementById("emptyState");

      let eventSource = null;
      let currentTopic = "";
      const pendingTexts = new Set();

      const nowTime = () => {
        const date = new Date();
        return date.toLocaleTimeString("zh-Hant", {
          hour: "2-digit",
          minute: "2-digit",
        });
      };

      const sanitizeTopic = (value) => {
        const topic = String(value || "").trim().replace(/\s+/g, "-").replace(/[^A-Za-z0-9._~-]/g, "-");
        return topic || DEFAULT_TOPIC;
      };

      const setState = (state, text) => {
        stateChip.dataset.state = state;
        stateChip.innerHTML = `<strong>狀態</strong>：${text}`;
      };

      const setTopicChip = (topic) => {
        topicChip.innerHTML = `<strong>Topic</strong>：${topic}`;
      };

      const scrollToBottom = () => {
        messages.scrollTop = messages.scrollHeight;
      };

      const showEmptyState = () => {
        emptyState.style.display = "grid";
      };

      const hideEmptyState = () => {
        emptyState.style.display = "none";
      };

      const renderBubble = (text, kind, time = nowTime()) => {
        hideEmptyState();
        const bubble = document.createElement("div");
        bubble.className = `bubble ${kind}`;
        bubble.innerHTML = `${escapeHtml(text)}<span class="time">${escapeHtml(time)}</span>`;
        messages.appendChild(bubble);
        scrollToBottom();
        return bubble;
      };

      const escapeHtml = (value) =>
        String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");

      const resizeMessageInput = () => {
        messageInput.style.height = "auto";
        messageInput.style.height = `${Math.min(messageInput.scrollHeight, 180)}px`;
      };

      const tryParseJson = (value) => {
        if (typeof value !== "string") {
          return value;
        }

        try {
          return JSON.parse(value);
        } catch {
          return value;
        }
      };

      const decodeMessage = (raw) => {
        let payload = raw;

        if (typeof raw === "string") {
          payload = tryParseJson(raw);
        }

        if (payload && typeof payload === "object") {
          const nested = tryParseJson(payload.message);
          if (nested && typeof nested === "object" && nested.text) {
            return nested;
          }

          if (typeof payload.text === "string") {
            return payload;
          }

          if (typeof payload.message === "string") {
            return {
              text: payload.message,
              sentAt: payload.sentAt || payload.time || "",
              sender: payload.sender || payload.topic || "未知",
              id: payload.id || payload.messageId || "",
            };
          }
        }

        return {
          text: String(raw ?? ""),
          sentAt: "",
          sender: "訊息",
          id: "",
        };
      };

      const closeConnection = () => {
        if (eventSource) {
          eventSource.close();
          eventSource = null;
        }
      };

      const connect = () => {
        const topic = sanitizeTopic(topicInput.value);
        topicInput.value = topic;
        setTopicChip(topic);
        currentTopic = topic;
        localStorage.setItem(STORAGE_KEY, topic);

        closeConnection();
        setState("ready", "連線中");
        connectButton.textContent = "重新連線";
        sendButton.disabled = false;

        const sseUrl = `https://ntfy.sh/${encodeURIComponent(topic)}/sse`;
        eventSource = new EventSource(sseUrl);

        eventSource.onopen = () => {
          setState("connected", "已連線");
        };

        eventSource.onerror = () => {
          setState("error", "連線中斷，正在等待重試");
        };

        eventSource.onmessage = (event) => {
          const data = decodeMessage(event.data);
          if (data.text && pendingTexts.has(data.text)) {
            pendingTexts.delete(data.text);
            return;
          }

          const text = data.text ?? "";
          if (!text.trim()) {
            return;
          }

          const timeValue = data.sentAt
            ? new Date(data.sentAt).toLocaleTimeString("zh-Hant", { hour: "2-digit", minute: "2-digit" })
            : nowTime();
          renderBubble(text, "other", timeValue);
        };
      };

      const sendMessage = async () => {
        const text = messageInput.value.trim();
        if (!text) {
          return;
        }

        const formattedText = `${SENDER_NAME}: ${text}`;

        const topic = sanitizeTopic(topicInput.value || currentTopic || DEFAULT_TOPIC);
        topicInput.value = topic;
        setTopicChip(topic);

        pendingTexts.add(formattedText);
        renderBubble(formattedText, "self", nowTime());
        messageInput.value = "";
        resizeMessageInput();

        try {
          const response = await fetch(`https://ntfy.sh/${encodeURIComponent(topic)}`, {
            method: "POST",
            headers: {
              "Content-Type": "text/plain; charset=utf-8",
              Title: "Chat",
            },
            body: formattedText,
          });

          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }

          setState("connected", "訊息已送出");
          window.setTimeout(() => {
            if (pendingTexts.has(formattedText)) {
              pendingTexts.delete(formattedText);
            }
          }, 5000);
        } catch (error) {
          pendingTexts.delete(formattedText);
          setState("error", "送出失敗，請檢查網路或 Topic");
          renderBubble(`送出失敗：${error instanceof Error ? error.message : String(error)}`, "other", nowTime());
        }
      };

      composer.addEventListener("submit", (event) => {
        event.preventDefault();
        sendMessage();
      });

      messageInput.addEventListener("input", resizeMessageInput);
      messageInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          sendMessage();
        }
      });

      connectButton.addEventListener("click", connect);
      clearButton.addEventListener("click", () => {
        messages.innerHTML = "";
        messages.appendChild(emptyState);
        showEmptyState();
      });

      topicInput.addEventListener("change", () => {
        topicInput.value = sanitizeTopic(topicInput.value);
        setTopicChip(topicInput.value);
      });

      const savedTopic = localStorage.getItem(STORAGE_KEY) || DEFAULT_TOPIC;
      topicInput.value = sanitizeTopic(savedTopic);
      setTopicChip(topicInput.value);
      showEmptyState();
      resizeMessageInput();
      setState("ready", "待連線");
    </script>
  </body>
</html>
