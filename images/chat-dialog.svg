<svg viewBox="0 0 200 120" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <defs>
    <linearGradient id="chatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f4f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0ede8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="200" height="120" fill="url(#chatGrad)"/>
  
  <!-- 手機框架 -->
  <rect x="35" y="8" width="130" height="104" rx="8" fill="white" stroke="#0e7490" stroke-width="1.5" opacity="0.95"/>
  
  <!-- 頭部 -->
  <rect x="35" y="8" width="130" height="18" rx="8" fill="#0e7490"/>
  <text x="102" y="19" font-size="8" font-weight="600" fill="white" text-anchor="middle" font-family="sans-serif">聊天</text>
  
  <!-- 聊天訊息 -->
  <!-- AI 訊息 1 -->
  <rect x="42" y="30" width="60" height="14" rx="6" fill="#e0f2fe" stroke="#0e7490" stroke-width="0.5"/>
  <text x="46" y="40" font-size="6" fill="#1a3a42" font-family="sans-serif">歡迎使用聊天</text>
  
  <!-- 用戶訊息 1 -->
  <rect x="110" y="48" width="50" height="14" rx="6" fill="#0e7490"/>
  <text x="114" y="58" font-size="6" fill="white" font-family="sans-serif">你好！</text>
  
  <!-- AI 訊息 2 -->
  <rect x="42" y="66" width="65" height="14" rx="6" fill="#e0f2fe" stroke="#0e7490" stroke-width="0.5"/>
  <text x="46" y="76" font-size="6" fill="#1a3a42" font-family="sans-serif">很高興認識你！</text>
  
  <!-- 輸入框 -->
  <rect x="40" y="85" width="75" height="12" rx="6" fill="white" stroke="#0e7490" stroke-width="0.8"/>
  <text x="45" y="92" font-size="5" fill="#4a6b75" font-family="sans-serif">輸入訊息...</text>
  
  <!-- 發送按鈕 -->
  <circle cx="122" cy="91" r="6" fill="#0e7490"/>
  <text x="122" y="94" font-size="8" fill="white" text-anchor="middle" font-family="sans-serif">➤</text>
  
  <!-- 通知指示 -->
  <circle cx="190" cy="14" r="4" fill="#d97706" opacity="0.8"/>
  <circle cx="190" cy="14" r="2.5" fill="#fbbf24"/>
</svg>