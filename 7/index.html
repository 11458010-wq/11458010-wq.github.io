<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>English Vocabulary Quiz</title>
    <style>
      :root {
        --bg-1: #0b1728;
        --bg-2: #13233d;
        --card: rgba(255, 255, 255, 0.9);
        --text: #172033;
        --muted: #4b5b76;
        --line: rgba(23, 32, 51, 0.15);
        --accent: #ff8a00;
        --accent-2: #ff4d4d;
        --ok: #0f9d58;
        --danger: #d93025;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at 8% 12%, rgba(255, 138, 0, 0.35), transparent 30%),
          radial-gradient(circle at 90% 16%, rgba(255, 77, 77, 0.28), transparent 28%),
          linear-gradient(145deg, var(--bg-1), var(--bg-2));
      }

      .page {
        width: min(980px, 94vw);
        margin: 0 auto;
        padding: 24px 0 36px;
      }

      .hero {
        padding: 22px;
        border-radius: 22px;
        background: linear-gradient(130deg, rgba(255, 138, 0, 0.95), rgba(255, 77, 77, 0.9));
        color: #fff;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.25);
      }

      .hero h1 {
        margin: 0;
        font-size: clamp(1.5rem, 4vw, 2.3rem);
      }

      .hero p {
        margin: 0.6rem 0 0;
        line-height: 1.7;
      }

      .meta {
        margin-top: 0.9rem;
        display: inline-flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .chip {
        padding: 0.35rem 0.7rem;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.4);
        background: rgba(255, 255, 255, 0.15);
        font-size: 0.9rem;
      }

      .panel {
        margin-top: 16px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: var(--card);
        padding: 18px;
        box-shadow: 0 12px 34px rgba(0, 0, 0, 0.15);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 12px;
      }

      button {
        border: none;
        border-radius: 12px;
        padding: 11px 18px;
        cursor: pointer;
        color: #fff;
        font-size: 1rem;
        font-weight: 800;
        background: linear-gradient(130deg, var(--accent), var(--accent-2));
      }

      button.secondary {
        background: linear-gradient(130deg, #3a6ff7, #2852c8);
      }

      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .status {
        min-height: 1.5rem;
        color: var(--muted);
      }

      .status.error {
        color: var(--danger);
      }

      .status.success {
        color: var(--ok);
      }

      .question {
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 14px;
        margin-top: 12px;
        background: #ffffff;
      }

      .q-title {
        margin: 0;
        line-height: 1.55;
        font-size: 1.06rem;
      }

      .options {
        margin-top: 10px;
        display: grid;
        gap: 8px;
      }

      .option {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        padding: 8px 9px;
        border: 1px solid var(--line);
        border-radius: 10px;
      }

      .result {
        margin-top: 14px;
        padding: 14px;
        border-radius: 12px;
        border: 1px dashed var(--line);
        background: #fff;
      }

      .result h2 {
        margin: 0 0 0.4rem;
        font-size: 1.25rem;
      }

      @media (max-width: 640px) {
        .page {
          width: 96vw;
          padding-top: 14px;
        }

        .hero,
        .panel {
          border-radius: 14px;
        }

        button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="hero">
        <h1>English Vocabulary Quiz</h1>
        <p>每次隨機抽 10 題，題目可能是中文或英文，全部採四選一，滿分 100 分。</p>
        <div class="meta">
          <span class="chip">10 Questions</span>
          <span class="chip">Multiple Choice</span>
          <span class="chip">Total: 100</span>
        </div>
      </section>

      <section class="panel">
        <div class="actions">
          <button id="startBtn" type="button">開始測驗</button>
          <button id="submitBtn" class="secondary" type="button" disabled>送出答案</button>
        </div>

        <p id="status" class="status">按下「開始測驗」後會載入隨機題目。</p>
        <div id="quizContainer"></div>
        <div id="result" class="result" style="display: none;"></div>
      </section>
    </main>

    <script>
      const startBtn = document.getElementById('startBtn');
      const submitBtn = document.getElementById('submitBtn');
      const statusEl = document.getElementById('status');
      const quizContainer = document.getElementById('quizContainer');
      const resultEl = document.getElementById('result');

      let currentQuiz = null;

      startBtn.addEventListener('click', loadQuiz);
      submitBtn.addEventListener('click', submitQuiz);

      function setStatus(message, type) {
        statusEl.textContent = message;
        statusEl.className = 'status' + (type ? ' ' + type : '');
      }

      function loadQuiz() {
        if (!isGasRuntime_()) {
          setStatus('請用 Google Apps Script 部署後的 Web App 網址開啟此頁面。', 'error');
          return;
        }

        startBtn.disabled = true;
        submitBtn.disabled = true;
        resultEl.style.display = 'none';
        setStatus('題目載入中，請稍候...');

        google.script.run
          .withSuccessHandler(function(data) {
            currentQuiz = data;
            renderQuiz(data.questions);
            startBtn.disabled = false;
            submitBtn.disabled = false;
            setStatus('題目已載入，請完成 10 題後送出。', 'success');
          })
          .withFailureHandler(function(error) {
            startBtn.disabled = false;
            setStatus(error.message || '載入失敗，請稍後再試。', 'error');
          })
          .getQuiz();
      }

      function renderQuiz(questions) {
        quizContainer.innerHTML = '';

        questions.forEach(function(question) {
          const block = document.createElement('section');
          block.className = 'question';

          const title = document.createElement('p');
          title.className = 'q-title';
          title.textContent = question.order + '. ' + question.prompt;
          block.appendChild(title);

          const optionsWrap = document.createElement('div');
          optionsWrap.className = 'options';

          question.options.forEach(function(option, idx) {
            const label = document.createElement('label');
            label.className = 'option';

            const input = document.createElement('input');
            input.type = 'radio';
            input.name = question.id;
            input.value = option;
            input.id = question.id + '_' + idx;

            const text = document.createElement('span');
            text.textContent = option;

            label.appendChild(input);
            label.appendChild(text);
            optionsWrap.appendChild(label);
          });

          block.appendChild(optionsWrap);
          quizContainer.appendChild(block);
        });
      }

      function submitQuiz() {
        if (!isGasRuntime_()) {
          setStatus('目前不是 GAS 執行環境，無法送出答案。', 'error');
          return;
        }

        if (!currentQuiz) {
          setStatus('請先載入題目。', 'error');
          return;
        }

        const answers = currentQuiz.questions.map(function(question) {
          const selected = document.querySelector('input[name="' + question.id + '"]:checked');
          return {
            id: question.id,
            answer: selected ? selected.value : ''
          };
        });

        const unansweredCount = answers.filter(function(item) {
          return !item.answer;
        }).length;

        if (unansweredCount > 0) {
          setStatus('還有 ' + unansweredCount + ' 題未作答。', 'error');
          return;
        }

        startBtn.disabled = true;
        submitBtn.disabled = true;
        setStatus('答案送出中...');

        google.script.run
          .withSuccessHandler(function(result) {
            startBtn.disabled = false;
            submitBtn.disabled = true;
            showResult(result);
            setStatus('測驗完成。', 'success');
          })
          .withFailureHandler(function(error) {
            startBtn.disabled = false;
            submitBtn.disabled = false;
            setStatus(error.message || '送出失敗，請再試一次。', 'error');
          })
          .submitQuiz({
            token: currentQuiz.token,
            answers: answers
          });
      }

      function showResult(result) {
        resultEl.style.display = 'block';
        resultEl.innerHTML =
          '<h2>你的分數：' + result.score + ' / ' + result.totalScore + '</h2>' +
          '<p>答對題數：' + result.correctCount + ' / ' + result.quizSize + '</p>';
      }

      function isGasRuntime_() {
        return (
          typeof google !== 'undefined' &&
          google &&
          google.script &&
          google.script.run
        );
      }
    </script>
  </body>
</html>
