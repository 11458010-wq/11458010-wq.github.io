<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>聊天對話框</title>
  <style>
    :root {
      --bg-top: #e8f4f8;
      --bg-bottom: #f0ede8;
      --panel: rgba(255, 248, 237, 0.86);
      --panel-border: rgba(30, 80, 100, 0.18);
      --text-main: #1a3a42;
      --text-soft: #4a6b75;
      --accent: #0e7490;
      --accent-strong: #065f73;
      --message-user: #0e7490;
      --message-ai: #e0f2fe;
      --shadow: 0 20px 50px rgba(26, 58, 66, 0.15);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      font-family: "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      color: var(--text-main);
      background:
        radial-gradient(circle at top, rgba(255, 255, 255, 0.5), transparent 35%),
        linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
      overflow-x: hidden;
    }

    .phone-stage {
      position: relative;
      width: min(100vw, 390px);
      min-height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border-radius: 0;
      box-shadow: var(--shadow);
    }

    @media (min-width: 428px) {
      .phone-stage {
        border-radius: 36px;
        border: 8px solid #2d2d2d;
        box-shadow: 0 0 0 12px rgba(45, 45, 45, 0.4), var(--shadow);
      }
    }

    .header {
      flex-shrink: 0;
      padding: 1rem 1.2rem 0.8rem;
      background: linear-gradient(135deg, var(--accent), var(--accent-strong));
      color: white;
      border-radius: 24px 24px 0 0;
      position: relative;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 {
      margin: 0;
      font-size: 1.4rem;
      font-weight: 600;
    }

    .designer {
      position: absolute;
      top: 0.8rem;
      right: 1.2rem;
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.85);
      letter-spacing: 0.05em;
      opacity: 0.9;
    }

    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      scroll-behavior: smooth;
    }

    .message {
      display: flex;
      animation: slideIn 300ms ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.user {
      justify-content: flex-end;
    }

    .message.ai {
      justify-content: flex-start;
    }

    .message-bubble {
      max-width: 78%;
      padding: 0.75rem 1rem;
      border-radius: 18px;
      word-wrap: break-word;
      line-height: 1.5;
      font-size: 0.95rem;
    }

    .message.user .message-bubble {
      background: var(--message-user);
      color: white;
      border-bottom-right-radius: 4px;
    }

    .message.ai .message-bubble {
      background: var(--message-ai);
      color: var(--text-main);
      border-bottom-left-radius: 4px;
      border: 1px solid rgba(14, 116, 144, 0.2);
    }

    .input-area {
      flex-shrink: 0;
      padding: 0.8rem 1rem 1rem;
      background: rgba(255, 255, 255, 0.5);
      border-top: 1px solid rgba(30, 80, 100, 0.1);
      display: flex;
      gap: 0.6rem;
      align-items: flex-end;
    }

    .input-field {
      flex: 1;
      border: 1px solid var(--panel-border);
      border-radius: 24px;
      padding: 0.7rem 1rem;
      font-size: 0.95rem;
      color: var(--text-main);
      font-family: inherit;
      background: white;
      outline: none;
      transition: border-color 200ms, box-shadow 200ms;
      resize: none;
      max-height: 100px;
    }

    .input-field:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(14, 116, 144, 0.1);
    }

    .input-field::placeholder {
      color: var(--text-soft);
    }

    .send-btn {
      flex-shrink: 0;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-strong));
      border: none;
      color: white;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 200ms, filter 200ms;
      outline: none;
    }

    .send-btn:hover {
      transform: scale(1.08);
      filter: brightness(1.1);
    }

    .send-btn:active {
      transform: scale(0.95);
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-soft);
      text-align: center;
      padding: 2rem;
    }

    .empty-state p {
      margin: 0.5rem 0;
      font-size: 0.95rem;
    }

    .loading {
      display: flex;
      gap: 4px;
      align-items: flex-end;
    }

    .loading span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-soft);
      animation: bounce 1.4s infinite;
    }

    .loading span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .loading span:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes bounce {
      0%, 80%, 100% {
        transform: translateY(0);
        opacity: 0.6;
      }
      40% {
        transform: translateY(-8px);
        opacity: 1;
      }
    }

    @media (max-width: 640px) {
      .phone-stage {
        border-radius: 0;
        border: none;
        box-shadow: none;
      }

      .message-bubble {
        max-width: 85%;
      }

      .input-area {
        padding: 0.7rem 0.8rem 0.9rem;
      }

      .designer {
        font-size: 0.7rem;
        right: 0.8rem;
      }
    }
  </style>
</head>
<body>
  <div class="phone-stage">
    <div class="header">
      <h1>聊天對話框</h1>
      <div class="designer">設計者：李宥叡</div>
    </div>

    <div class="chat-container" id="chatContainer">
      <div class="empty-state">
        <p>👋 歡迎使用聊天對話框</p>
        <p style="font-size: 0.88rem; color: var(--text-soft);">輸入訊息開始對話</p>
      </div>
    </div>

    <div class="input-area">
      <input
        type="text"
        class="input-field"
        id="messageInput"
        placeholder="輸入訊息..."
        autocomplete="off"
      />
      <button class="send-btn" id="sendBtn" title="發送">➤</button>
    </div>
  </div>

  <script>
    const chatContainer = document.getElementById('chatContainer');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');

    // ntfy.sh 配置
    const NTFY_TOPIC = 'drher';
    const NTFY_URL = 'https://ntfy.sh/' + NTFY_TOPIC;

    // 顯示歡迎訊息
    function showWelcome() {
      chatContainer.innerHTML = `
        <div class="empty-state">
          <p>👋 歡迎使用聊天對話框</p>
          <p style="font-size: 0.88rem; color: var(--text-soft);">輸入訊息開始對話</p>
        </div>
      `;
    }

    // 添加訊息到聊天
    function addMessage(text, isUser = true) {
      if (chatContainer.querySelector('.empty-state')) {
        chatContainer.innerHTML = '';
      }

      const messageEl = document.createElement('div');
      messageEl.className = `message ${isUser ? 'user' : 'ai'}`;
      messageEl.innerHTML = `
        <div class="message-bubble">${escapeHtml(text)}</div>
      `;
      chatContainer.appendChild(messageEl);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    // 添加加載動畫
    function showLoadingState() {
      const messageEl = document.createElement('div');
      messageEl.className = 'message ai';
      messageEl.id = 'loadingMessage';
      messageEl.innerHTML = `
        <div class="message-bubble">
          <div class="loading">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
      `;
      chatContainer.appendChild(messageEl);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    // 移除加載狀態
    function removeLoadingState() {
      const loadingEl = document.getElementById('loadingMessage');
      if (loadingEl) loadingEl.remove();
    }

    // HTML 轉義
    function escapeHtml(text) {
      const map = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      };
      return text.replace(/[&<>"']/g, m => map[m]);
    }

    // 發送訊息到 ntfy.sh
    async function sendToNtfy(message) {
      try {
        const response = await fetch(NTFY_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            title: '宥叡',
            message: message,
            timestamp: new Date().toLocaleTimeString('zh-TW')
          })
        });

        if (!response.ok) {
          throw new Error('發送失敗');
        }

        return true;
      } catch (error) {
        console.error('ntfy 發送錯誤:', error);
        return false;
      }
    }

    // 模擬 AI 回應
    function getAIResponse(userMessage) {
      const responses = [
        '很高興認識你！有什麼我可以幫助你的嗎？',
        '你說得好有意思呢！能告訴我更多嗎？',
        '我理解你的想法。你有其他問題嗎？',
        '太棒了！我想這是個不錯的想法。',
        '我同意你的看法。你還有什麼想說的嗎？',
        '這是個很好的問題。讓我來思考一下...',
        '你說的非常對！非常感謝你的分享。',
        '有趣的觀點！你怎麼會這樣想呢？'
      ];

      return responses[Math.floor(Math.random() * responses.length)];
    }

    // 發送訊息
    async function sendMessage() {
      const text = messageInput.value.trim();
      if (!text) return;

      messageInput.value = '';
      messageInput.style.height = 'auto';

      // 添加用戶訊息
      addMessage(text, true);

      // 發送到 ntfy.sh
      await sendToNtfy(text);

      // 顯示加載狀態
      showLoadingState();

      // 延遲以提供對話感
      setTimeout(() => {
        removeLoadingState();
        const aiResponse = getAIResponse(text);
        addMessage(aiResponse, false);
      }, 800 + Math.random() * 600);

      // 焦點回到輸入框
      messageInput.focus();
    }

    // 事件監聽器
    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    // 自動調整輸入框高度
    messageInput.addEventListener('input', () => {
      messageInput.style.height = 'auto';
      messageInput.style.height = Math.min(messageInput.scrollHeight, 100) + 'px';
    });

    // 初始化
    showWelcome();
    messageInput.focus();
  </script>
</body>
</html>
